name: Build and Publish TITV Desktop

on:
  push:
    branches:
      - titv-desktop-autoupdate
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: titv-desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare V3.30.7 desktop app
        shell: pwsh
        run: |
          $base = "https://6ab0bfee2d703b9a4ff788c0--titv-engineering-scheduler.netlify.app"

          New-Item -ItemType Directory -Force -Path app/vendor | Out-Null
          New-Item -ItemType Directory -Force -Path build | Out-Null

          Invoke-WebRequest -Uri "$base/RELEASE_NOTES_V3.30.7.txt" -OutFile "app/RELEASE_NOTES_V3.30.7.txt"
          $release = Get-Content "app/RELEASE_NOTES_V3.30.7.txt" -Raw
          if ($release -notmatch "V3\.30\.7") {
            throw "Pinned Netlify deploy is not TITV V3.30.7."
          }

          Invoke-WebRequest -Uri "$base/" -OutFile "app/index.html"
          Invoke-WebRequest -Uri "$base/vendor/jszip.min.js" -OutFile "app/vendor/jszip.min.js"
          Invoke-WebRequest -Uri "$base/TITV_LOGO.png" -OutFile "app/TITV_LOGO.png"
          Invoke-WebRequest -Uri "$base/favicon.ico" -OutFile "app/favicon.ico"
          Invoke-WebRequest -Uri "$base/favicon-32x32.png" -OutFile "app/favicon-32x32.png"
          Invoke-WebRequest -Uri "$base/apple-touch-icon.png" -OutFile "app/apple-touch-icon.png"
          Invoke-WebRequest -Uri "$base/android-chrome-192x192.png" -OutFile "app/android-chrome-192x192.png"
          Invoke-WebRequest -Uri "$base/site.webmanifest" -OutFile "app/site.webmanifest"

          $p = Resolve-Path "app/index.html"
          $s = [System.IO.File]::ReadAllText($p, [System.Text.Encoding]::UTF8)
          $publicBase = "https://titv-engineering-scheduler.netlify.app"
          $tick = [char]96
          $s = $s.Replace("fetch(" + $tick + "/.netlify/functions/", "fetch(" + $tick + $publicBase + "/.netlify/functions/")
          $s = $s.Replace("fetch('/.netlify/functions/", "fetch('" + $publicBase + "/.netlify/functions/")
          $s = $s.Replace('fetch("/.netlify/functions/', 'fetch("' + $publicBase + '/.netlify/functions/')
          $s = $s.Replace('${location.origin}/line-webhook', $publicBase + '/line-webhook')
          $s = $s.Replace('${location.origin}', $publicBase)
          [System.IO.File]::WriteAllText($p, $s, [System.Text.UTF8Encoding]::new($false))

          Add-Type -AssemblyName System.Drawing
          $src = [System.Drawing.Image]::FromFile((Resolve-Path "app/android-chrome-192x192.png"))
          $bmp = New-Object System.Drawing.Bitmap 512, 512
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::Transparent)
          $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::HighQuality
          $g.PixelOffsetMode = [System.Drawing.Drawing2D.PixelOffsetMode]::HighQuality
          $g.DrawImage($src, 0, 0, 512, 512)
          $bmp.Save((Join-Path (Get-Location) "build/icon.png"), [System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose()
          $bmp.Dispose()
          $src.Dispose()

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer and update metadata
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify updater output
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = "dist/TITV_Engineering_Scheduler_Setup_$($version)_x64.exe"
          $blockmap = "$installer.blockmap"
          if (!(Test-Path $installer)) { throw "Installer was not generated: $installer" }
          if (!(Test-Path "dist/latest.yml")) { throw "latest.yml was not generated." }
          if (!(Test-Path $blockmap)) { throw "NSIS blockmap was not generated: $blockmap" }
          Write-Host "Desktop version: $version"
          Get-Content "dist/latest.yml"
          Get-ChildItem dist

      - name: Create release notes
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          @"
          TITV 工程部製播排班系統 Desktop $version

          系統核心：V3.30.7

          本版更新：
          - 更新至 TITV 製播排班系統 V3.30.7。
          - 修復 employees.hire_date 與 leaves.leave_meta 雲端同步與 schema cache。
          - 新增 Windows 桌面版自動更新機制。
          - 軟體啟動後自動檢查更新，並每 4 小時再次檢查。
          - 新版會自動下載，下載完成後可立即重新啟動安裝，或稍後於關閉軟體時安裝。
          - 保留 TITV 原民台軟體圖示、Supabase 即時資料、LINE／Email／輸出功能。
          "@ | Set-Content -Path "release_notes.md" -Encoding UTF8

      - name: Publish GitHub auto-update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "titv-desktop-v$version"
          $repository = "thewritethatstaysmusic2025-cmyk/register"
          $installer = "dist/TITV_Engineering_Scheduler_Setup_$($version)_x64.exe"
          $blockmap = "$installer.blockmap"

          gh release view $tag --repo $repository *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --repo $repository --cleanup-tag --yes
          }

          $releaseArgs = @(
            "release", "create", $tag,
            $installer,
            "dist/latest.yml",
            $blockmap,
            "--repo", $repository,
            "--target", $env:GITHUB_SHA,
            "--title", "TITV Desktop $version",
            "--notes-file", "release_notes.md",
            "--latest"
          )
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publication failed." }

      - name: Verify published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "titv-desktop-v$version"
          gh release view $tag --repo "thewritethatstaysmusic2025-cmyk/register" --json tagName,assets,url

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TITV-Windows-Desktop-4.0.3-AutoUpdate
          path: |
            titv-desktop/dist/TITV_Engineering_Scheduler_Setup_4.0.3_x64.exe
            titv-desktop/dist/TITV_Engineering_Scheduler_Setup_4.0.3_x64.exe.blockmap
            titv-desktop/dist/latest.yml
          if-no-files-found: error
