name: TITV half-day final 4.0.12
on:
  push:
    branches: [titv-halfday-406]
    paths: [.github/workflows/titv-halfday-final.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: titv-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set consistent build version
        run: |
          npm version 4.0.12 --no-git-tag-version
          npm pkg set 'scripts.prepare:ui=node prepare412.mjs'
          node -e "const fs=require('fs');fs.writeFileSync('preload.cjs',fs.readFileSync('preload.cjs','utf8').replaceAll('4.0.6','4.0.12'));fs.writeFileSync('smoke412.mjs',fs.readFileSync('smoke405.mjs','utf8').replaceAll('4.0.5','4.0.12').replaceAll('V3.33.8','V3.33.9'));"
      - run: npm install --no-audit --no-fund
      - run: node prepare412.mjs
      - run: node --check runtime/main.cjs
      - run: npx playwright install chromium
      - run: node test405.mjs
      - run: node test406.mjs
      - name: Preserve TITV icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $src=[Drawing.Image]::FromFile((Resolve-Path 'app/android-chrome-192x192.png'))
          $bmp=New-Object Drawing.Bitmap 512,512
          $g=[Drawing.Graphics]::FromImage($bmp)
          $g.Clear([Drawing.Color]::Transparent)
          $g.InterpolationMode=[Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          $g.DrawImage($src,0,0,512,512)
          $bmp.Save((Join-Path (Get-Location) 'build/icon.png'),[Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose();$bmp.Dispose();$src.Dispose()
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node smoke412.mjs
      - name: Assemble release and verification report
        shell: pwsh
        run: |
          $exe='dist/TITV_Engineering_Scheduler_Setup_4.0.12_x64.exe'
          if(!(Test-Path $exe) -or !(Test-Path "$exe.blockmap")){throw 'Missing release assets'}
          if((Get-Content 'dist/latest.yml' -Raw) -notmatch 'version: 4.0.12'){throw 'Updater version mismatch'}
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  TITV_Engineering_Scheduler_Setup_4.0.12_x64.exe"|Set-Content 'dist/SHA256SUMS.txt'
          Compress-Archive -Path 'web-overlay/*' -DestinationPath 'dist/TITV_Web_V3.33.9_HalfDay_Overlay.zip'
          $r=@{version='4.0.12';core='V3.33.9';sha256=$hash;installerBytes=(Get-Item $exe).Length;signed=$false;webProductionDeployed=$false;aboutVersionUsesManifest=$true;ui=(Get-Content 'qa/test-report.json' -Raw|ConvertFrom-Json);halfday=(Get-Content 'qa/halfday-tests.json' -Raw|ConvertFrom-Json);windows=(Get-Content 'qa/windows-smoke.json' -Raw|ConvertFrom-Json);manifest=(Get-Content 'qa/halfday-manifest.json' -Raw|ConvertFrom-Json)}
          $r|ConvertTo-Json -Depth 20|Set-Content 'dist/TEST_REPORT.json' -Encoding utf8
          'TITV 4.0.12 / Core V3.33.9: internal half-day leave with explicit time range, cloud metadata compatibility, matching About version, existing SVG repair retained. Verified with synthetic data and packaged Windows launch. Unsigned installer. Web frontend deployment is separate.'|Set-Content 'release_notes.md'
      - name: Publish tested automatic update
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo='thewritethatstaysmusic2025-cmyk/register'
          gh release view v4.0.12 --repo $repo *> $null
          if($LASTEXITCODE -eq 0){throw 'Refusing to overwrite an existing release'}
          gh release create v4.0.12 'dist/TITV_Engineering_Scheduler_Setup_4.0.12_x64.exe' 'dist/TITV_Engineering_Scheduler_Setup_4.0.12_x64.exe.blockmap' 'dist/latest.yml' 'dist/SHA256SUMS.txt' 'dist/TEST_REPORT.json' 'dist/TITV_Web_V3.33.9_HalfDay_Overlay.zip' --repo $repo --target $env:GITHUB_SHA --title 'TITV Desktop 4.0.12 — Half-day Leave' --notes-file 'release_notes.md' --latest
          if($LASTEXITCODE -ne 0){throw 'Publication failed'}
      - uses: actions/upload-artifact@v4
        with:
          name: TITV-4.0.12-HalfDay-Final
          path: |
            titv-desktop/dist/*.exe
            titv-desktop/dist/*.blockmap
            titv-desktop/dist/latest.yml
            titv-desktop/dist/SHA256SUMS.txt
            titv-desktop/dist/TEST_REPORT.json
            titv-desktop/dist/TITV_Web_V3.33.9_HalfDay_Overlay.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TITV-412-QA
          path: |
            titv-desktop/qa/*.json
            titv-desktop/qa/*.svg
            titv-desktop/qa/screenshots/*.png
          if-no-files-found: warn
