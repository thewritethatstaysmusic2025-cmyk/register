name: TITV 4.0.6 shared half-day release
on:
  push:
    branches: [titv-desktop-406-halfday]
    paths: [.github/workflows/titv406-release.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: titv406-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: titv-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare private deployment authorization channel
        run: node deploy406.mjs keygen
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Set application version and test expectations
        shell: pwsh
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.version='4.0.6';fs.writeFileSync('package.json',JSON.stringify(p,null,2));for(const f of ['preload.cjs'])fs.writeFileSync(f,fs.readFileSync(f,'utf8').replaceAll('4.0.5','4.0.6'));fs.writeFileSync('smoke406.mjs',fs.readFileSync('smoke405.mjs','utf8').replaceAll('4.0.5','4.0.6').replaceAll('V3.33.8','V3.33.9'));"
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: Prepare prior verified UI repairs
        run: npm run prepare:ui
      - name: Add half-day leave to both clients
        shell: pwsh
        run: |
          node halfday406.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Half-day patch failed' }
      - name: Install verification browser
        run: npx playwright install chromium
      - name: Test half-day workflow on web and desktop renderers
        shell: pwsh
        run: |
          node test406.mjs
          if ($LASTEXITCODE -ne 0) { throw 'UI tests failed; production unchanged' }
      - name: Prepare original TITV application icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $src = [Drawing.Image]::FromFile((Resolve-Path 'app/android-chrome-192x192.png'))
          $bmp = New-Object Drawing.Bitmap 512,512
          $g = [Drawing.Graphics]::FromImage($bmp)
          $g.Clear([Drawing.Color]::Transparent)
          $g.InterpolationMode = [Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          $g.DrawImage($src,0,0,512,512)
          $bmp.Save((Join-Path (Get-Location) 'build/icon.png'),[Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose();$bmp.Dispose();$src.Dispose()
      - name: Build Windows installation and update files
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Launch and verify packaged Windows application
        shell: pwsh
        run: |
          node smoke406.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows launch failed' }
      - name: Publish verified web update preserving existing backend
        shell: pwsh
        run: |
          node deploy406.mjs deploy
          if ($LASTEXITCODE -ne 0) { throw 'Web deployment incomplete; desktop release not announced yet' }
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Assemble release verification
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force delivery | Out-Null
          node -e "const fs=require('fs'),c=require('crypto');const f='dist/TITV_Engineering_Scheduler_Setup_4.0.6_x64.exe';const b=fs.readFileSync(f);const r={version:'4.0.6',core:'V3.33.9',signed:false,installerBytes:b.length,sha256:c.createHash('sha256').update(b).digest('hex'),uiTests:JSON.parse(fs.readFileSync('qa/halfday-test-report.json')),windowsSmoke:JSON.parse(fs.readFileSync('qa/windows-smoke.json')),webDeployment:JSON.parse(fs.readFileSync('qa/web-deployment406.json'))};fs.writeFileSync('delivery/TEST_REPORT.json',JSON.stringify(r,null,2));fs.writeFileSync('delivery/SHA256SUMS.txt',r.sha256+'  TITV_Engineering_Scheduler_Setup_4.0.6_x64.exe\n');"
          Copy-Item dist/TITV_Engineering_Scheduler_Setup_4.0.6_x64.exe delivery/
          Compress-Archive -Path web-overlay/index.html,web-overlay/ui-icons.mjs,web-overlay/ui-icons.css,web-overlay/release-info.json -DestinationPath delivery/TITV_Web_V3.33.9_Frontend_Overlay.zip -Force
          @'
          TITV Desktop 4.0.6 / Core V3.33.9
          台內狀態新增「半天（0.5 日）」；原有台內休假亦可選半天記錄單位。
          上午、下午預設及自訂起訖時間；以實際時段檢查排班衝突。
          保留原假別代碼，半天資料寫入既有 leaves.leave_meta。
          班表、列印與 Excel 顯示半天時段；保留原民台圖示及圖示防重複修正。
          網頁與 Windows 使用相同核心程式。網頁原有檔案及四個後端 Functions 保留。
          Windows 安裝檔尚未簽署發行者憑證。測試使用隔離資料；未代替使用者測試真實帳號登入或發送通知。
          '@ | Set-Content release406-notes.txt -Encoding utf8
      - name: Publish desktop auto-update only after both clients pass
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v4.0.6 --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Version 4.0.6 already exists; never overwrite a released binary' }
          gh release create v4.0.6 dist/TITV_Engineering_Scheduler_Setup_4.0.6_x64.exe dist/TITV_Engineering_Scheduler_Setup_4.0.6_x64.exe.blockmap dist/latest.yml delivery/TEST_REPORT.json delivery/SHA256SUMS.txt delivery/TITV_Web_V3.33.9_Frontend_Overlay.zip --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title 'TITV Desktop 4.0.6 — 台內半天休假' --notes-file release406-notes.txt --draft
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          gh release edit v4.0.6 --repo "$env:GITHUB_REPOSITORY" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
          gh release view v4.0.6 --repo "$env:GITHUB_REPOSITORY" --json tagName,assets,url
      - name: Retain all verification and installer outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TITV-406-Delivery
          path: |
            titv-desktop/delivery/*
            titv-desktop/dist/*Setup*.exe
            titv-desktop/qa/*.json
            titv-desktop/qa/screenshots/*.png
          retention-days: 30
          if-no-files-found: warn
