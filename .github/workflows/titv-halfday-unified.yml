name: TITV unified half-day 4.0.11
on:
  push:
    branches: [titv-halfday-406]
    paths: [.github/workflows/titv-halfday-unified.yml]
permissions:
  contents: write
concurrency:
  group: titv-unified-halfday-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: titv-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare consistent application version
        run: |
          npm version 4.0.11 --no-git-tag-version
          npm pkg set 'scripts.prepare:ui=node prepare411.mjs'
          node -e "const fs=require('fs');let p=fs.readFileSync('preload.cjs','utf8');p=p.replace(/version:'4\.0\.\d+'/,\"version:'4.0.11'\");fs.writeFileSync('preload.cjs',p);fs.writeFileSync('smoke411.mjs',fs.readFileSync('smoke405.mjs','utf8').replaceAll('4.0.5','4.0.11').replaceAll('V3.33.8','V3.33.9'));"
      - run: npm install --no-audit --no-fund
      - run: node prepare411.mjs
      - run: npx playwright install chromium
      - run: node test405.mjs
      - run: node test406.mjs
      - name: Preserve original TITV application icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $src=[Drawing.Image]::FromFile((Resolve-Path 'app/android-chrome-192x192.png'))
          $bmp=New-Object Drawing.Bitmap 512,512
          $g=[Drawing.Graphics]::FromImage($bmp)
          $g.Clear([Drawing.Color]::Transparent)
          $g.InterpolationMode=[Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          $g.DrawImage($src,0,0,512,512)
          $bmp.Save((Join-Path (Get-Location) 'build/icon.png'),[Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose();$bmp.Dispose();$src.Dispose()
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node smoke411.mjs
      - name: Verify release files and prepare report
        shell: pwsh
        run: |
          $exe='dist/TITV_Engineering_Scheduler_Setup_4.0.11_x64.exe'
          if(!(Test-Path $exe) -or !(Test-Path "$exe.blockmap")){throw 'Installer missing'}
          if((Get-Content 'dist/latest.yml' -Raw) -notmatch 'version: 4.0.11'){throw 'Wrong update metadata'}
          $hash=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  TITV_Engineering_Scheduler_Setup_4.0.11_x64.exe"|Set-Content 'dist/SHA256SUMS.txt'
          Compress-Archive -Path 'web-overlay/*' -DestinationPath 'dist/TITV_Web_V3.33.9_HalfDay_Overlay.zip'
          $report=@{version='4.0.11';core='V3.33.9';sha256=$hash;installerBytes=(Get-Item $exe).Length;signed=$false;webProductionDeployed=$false;ui=(Get-Content 'qa/test-report.json' -Raw|ConvertFrom-Json);halfday=(Get-Content 'qa/halfday-tests.json' -Raw|ConvertFrom-Json);windows=(Get-Content 'qa/windows-smoke.json' -Raw|ConvertFrom-Json);manifest=(Get-Content 'qa/halfday-manifest.json' -Raw|ConvertFrom-Json)}
          $report|ConvertTo-Json -Depth 20|Set-Content 'dist/TEST_REPORT.json' -Encoding utf8
          @'
          TITV Desktop 4.0.11 / Web core V3.33.9
          Internal leave now supports half-day (0.5 day), with explicit start/end times.
          Preserves existing leave codes, records, and SVG UI repairs.
          Compatible cloud metadata, timed conflict checks, form edit round-trip, PNG/print/Excel labels.
          Verified with isolated synthetic records and packaged Windows launch; no live notification tests.
          The web overlay must be merged into the full existing Netlify project; it is not a standalone deployment.
          Windows installer is unsigned. This release does not itself deploy the web frontend.
          '@|Set-Content 'release_notes.md' -Encoding utf8
      - name: Publish verified updater assets without overwriting any release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo='thewritethatstaysmusic2025-cmyk/register'
          gh release view v4.0.11 --repo $repo *> $null
          if($LASTEXITCODE -eq 0){throw 'Release already exists; refusing overwrite.'}
          gh release create v4.0.11 'dist/TITV_Engineering_Scheduler_Setup_4.0.11_x64.exe' 'dist/TITV_Engineering_Scheduler_Setup_4.0.11_x64.exe.blockmap' 'dist/latest.yml' 'dist/SHA256SUMS.txt' 'dist/TEST_REPORT.json' 'dist/TITV_Web_V3.33.9_HalfDay_Overlay.zip' --repo $repo --target $env:GITHUB_SHA --title 'TITV Desktop 4.0.11 — Half-day Leave' --notes-file 'release_notes.md' --latest
          if($LASTEXITCODE -ne 0){throw 'Release publication failed'}
      - uses: actions/upload-artifact@v4
        with:
          name: TITV-4.0.11-HalfDay-Verified
          path: |
            titv-desktop/dist/*.exe
            titv-desktop/dist/*.blockmap
            titv-desktop/dist/latest.yml
            titv-desktop/dist/SHA256SUMS.txt
            titv-desktop/dist/TEST_REPORT.json
            titv-desktop/dist/TITV_Web_V3.33.9_HalfDay_Overlay.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TITV-411-QA
          path: |
            titv-desktop/qa/*.json
            titv-desktop/qa/*.svg
            titv-desktop/qa/screenshots/*.png
          if-no-files-found: warn
